<html>
   <head>
      <style>
         div.trafficLight {
            width: 3rem;
            height: 10rem;
            display: flex;
            flex-direction: column;
            background-color: black;
            padding: 1rem;
            gap: 1rem;
         }

         div.light {
            background-color: red;
            border-radius: 50%;
            width: 3rem;
            height: 3rem;
         }
      </style>
   </head>
   <body>
      <div id="light" class="trafficLight">
         <div id="red-light" class="light" style="background-color: red"></div>
         <div
            id="yellow-light"
            class="light"
            style="background-color: yellow"
         ></div>
         <div
            id="green-light"
            class="light"
            style="background-color: green"
         ></div>
      </div>
   </body>
   <script src="main.js"></script>
</html>
