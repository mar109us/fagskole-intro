Legg till pagination med tall -->

<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Document</title>
   </head>
   <style>
      .page-container {
         display: flex;
         flex-direction: column;
         gap: 20px;
      }
      .pagination {
         display: flex;
         flex-wrap: wrap;
         justify-content: flex-start;
         gap: 10px;
      }
      .page-button {
         width: 10%;
      }
   </style>
   <body>
      <div id="app"></div>
   </body>
   <script>
      const app = document.getElementById("app");

      const array = {
         data: [],
         size: 100,
         numberAmount: 10,
      };

      const page = {
         data: [],
         current: 1,
         items: 10,
         indexFix: 1,
         startItem: 0,
         endItem: 10,
      };

      function updateView() {
         app.innerHTML = drawView();
      }
      fillArray();
      updateView();

      function drawView() {
         let view = `
         <div class="page-container">
            <div class="current-page">current page ${page.current}</div>
            <div class"data">${getPage()}</div>
            <div class="pagination">${getPagination()}</div>
         </div>
         `;
         return view;
      }

      function getPage() {
         slicePage();
         console.table(page.data);
         console.table(array.data);
         return page.data.map((value) => `<div>${value}</div>`).join('');
      }

      function slicePage() {
         page.data = array.data.slice(page.startItem, page.endItem);
      }

      function getPagination() {
         let pageAmount = array.data.length / page.items;
         let pagination = "";
         for (let i = 0; i < pageAmount; i++) {
            pagination += `<button onclick="changePage(${i})" class="page-button">${i + page.indexFix}</button>`;
         }
         return pagination;
      }

      function changePage(index) {
         page.startItem = index * page.items;
         page.endItem = index * page.items + page.items;
         page.current = index + page.indexFix;
         console.log(index);
         updateView();
      }

      function fillArray() {
         for (let i = 0; i < array.size; i++) {
            let tempNumberOfArray = [];
            
            console.log(createRandom())

            for (let j = 0; j < array.numberAmount; j++) {
               tempNumberOfArray.push(createRandom());
            }
            array.data.push(tempNumberOfArray);
         }
      }

      function createRandom() {
         return Math.floor(Math.random() * 10);
      }
   </script>
</html>
