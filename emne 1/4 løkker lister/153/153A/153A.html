<!-- Lag array med tall
Legg till pagination med tall -->

<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Document</title>
   </head>
   <style>
      .page-container {
         display: flex;
         flex-direction: column;
         gap: 20px;
      }
      .pagination {
         display: flex;
         flex-wrap: wrap;
         justify-content: flex-start;
         gap: 10px;
      }
      .page-button {
         width: 10%;
      }
   </style>
   <body>
      <div id="app"></div>
   </body>
   <script>
      const app = document.getElementById("app");
      let array = [];
      let arraySize = 100;
      let numberSize = 10;

      let pageArray = [];
      let currentPage = 1;
      let itemsPerPage = 10;
      let indexFix = 1;
      let page = "";
      let pagination = "";

      let pageStartItem = 0
      let pageEndItem = 10

      function updateView() {
         app.innerHTML = drawView();
      }
      fillArray();
      updateView();

      function drawView() {
         getData();
         let view = `
         <div class="page-container">
            <div class="current-page">current page ${currentPage}</div>
            <div class"data">${page}</div>
            <div class="pagination">${pagination}</div>
         </div>

         `;
         return view;
      }

      function getData() {
         getPage();
         getPagination();
      }

      function getPage() {
         slicePage();
         page = pageArray.map((value) => `<div>${value}</div>`).join("");

         console.table(pageArray);
         console.table(array);
      }

      function slicePage() {
         pageArray = array.slice(pageStartItem, pageEndItem);
      }

      function getPagination() {
         let pageAmount = array.length / itemsPerPage;
         pagination = ""
         for (let i = 0; i < pageAmount; i++) {
            pagination += `<button onclick="changePage(${i})" class="page-button">${i + indexFix}</button>`;
         }
      }

      function changePage(index) {
         pageStartItem = index * itemsPerPage
         pageEndItem = index * itemsPerPage + itemsPerPage
         currentPage = index + indexFix
         console.log(index)
         updateView()
      }

      function fillArray() {
         for (let i = 0; i < arraySize; i++) {
            let tempNumberOfArray = [];
            for (let j = 0; j < numberSize; j++) {
               tempNumberOfArray += createRandom();
            }
            array.push(tempNumberOfArray);
         }
      }

      function createRandom() {
         return Math.floor(Math.random() * 10);
      }
   </script>
</html>
