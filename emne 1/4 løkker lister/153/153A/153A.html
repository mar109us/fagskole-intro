<!-- Lag array med tall
Legg till pagination med tall -->

<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Document</title>
   </head>
   <body>
      <div id="app"></div>
   </body>
   <script>
      const app = document.getElementById("app");
      let array = [];
      let arraySize = 20;
      let numberSize = 10;

      let pageArray = [];
      let currentPage = 1;
      let itemsPerPage = 10;
      let indexFix = 1;
      let page = "";
      let pagination = ""

      function updateView() {
         app.innerHTML = drawView();
      }
      updateView();

      function drawView() {
         getData();
         let view = `
         <div>current page ${currentPage}</div>
         <div>${page}</div>
         <div>${pagination}</div>

         `;
         return view;
      }

      function getData() {
         fillArray();
         getPage();
         getPagination()
      }

      function getPage() {
         slicePage()

         page = pageArray.map((value) => `<div>${value}</div>`).join("");

         // console.table(pageArray);
         // console.table(array);
      }

      function slicePage() {
         pageArray = array.slice(currentPage - indexFix, itemsPerPage);

      }

      function getPagination() {
         pagination = pageArray.map(value => `<button>${pageArray.indexOf(value) + indexFix}</button>`).join("")
      }

      function fillArray() {
         for (let i = 0; i < arraySize; i++) {
            let tempNumberOfArray = [];
            for (let j = 0; j < numberSize; j++) {
               tempNumberOfArray += createRandom();
            }
            array.push(tempNumberOfArray);
         }
      }

      function createRandom() {
         return Math.floor(Math.random() * numberSize);
      }
   </script>
</html>
