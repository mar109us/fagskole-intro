<!-- 
Lag en nettside hvor brukeren kan lime inn en lengre tekst 
knapp for å få telt opp hvor mange det er av hvert ord. 

Rens teksten for alt annet enn tegnene A-Z, Æ, Ø og Å
i store og små bokstaver, mellomrom. 
Bruk en løkke til å gå gjennom alle bokstavene 
kopier bare bokstaver over i en ny tekst.

Bruk text.split(' ') til å dele opp en tekst i en liste av ord.

Til opptellingen trenger du to lister: words og wordCounts.
Gå gjennom alle ordene. 
Sjekk først om ordet finnes i words med indexOf.
er opptellingen i samme indeks i wordCounts - øk den med én. 
Hvis ordet ikke finnes i words, legger du det til med push() 
- og du legger til 1 i wordCounts, altså wordsCounts.push(1).

Eksempel:

indeks	words	   wordCounts
0        'en'	   5
1	      'hei'	   1
2	      'eller'	2

Etter opptellingen, går du gjennom begge listene 
samtidig i en løkke og viser hvor mange det forekomster 
det var av hvert ord. 
-->

         function updateView() {
            app.innerHTML = input();
            document.getElementById("text-value").value = saveValue;
         }
         updateView();

         function input() {
            return `
               <div class="input row">
                  <textarea id="text-value" onchange="cleanText(this.value)"></textarea>
                  <button onclick="updateView()">check text</button>
               </div>
               
               <div class="output column">
                     <div id="piechart"></div>
                     <div id="chart_div"></div>
                  ${wordOutput}
               </div>
               `;
         }

         function initVariables() {
            allWords = [];
            words = [];
            wordsCount = [];
            wordOutput = "";
            highestWord = [];
            highestWordIndex = [];
         }

         function cleanText(text) {
            initVariables();
            saveValue = text;
            textContent = text;
            textToLowerCase();
            keepAllowedCharacters();
            splitText();
            removeDuplicates();
            cleanForOutput();
            getDataForPieChart();
         }

         function textToLowerCase() {
            textContent = textContent.replace(/[\r\n\t]/g, " ").toLowerCase();
         }

         function keepAllowedCharacters() {
            let tempText = "";
            for (let i of textContent) {
               if (allowedCharacters.includes(i)) {
                  tempText += i;
               }
            }
            textContent = tempText;
         }

         function splitText() {
            allWords = textContent.split(" ");
         }

         function removeDuplicates() {
            for (let i of allWords) {
               if (words.includes(i)) {
                  wordsCount[words.indexOf(i)]++;
               } else {
                  words.push(i);
                  wordsCount.push(1);
               }
            }
         }
         function cleanForOutput() {
            let tempWords = "";
            let count = 0;
            for (let i of words) {
               if (i !== " " && i !== "") {
                  if (count === 0) {
                     tempWords += `
                           <div class="text-output seperator">
                              <span>${i}</span>
                              <span>${wordsCount[words.indexOf(i)]}</span>
                           </div>`;
                     count++;
                  } else {
                     tempWords += `
                           <div class="text-output">
                              <span>${i}</span>
                              <span>${wordsCount[words.indexOf(i)]}</span>
                           </div>`;
                     count = 0;
                  }
               }
            }
            wordOutput = tempWords;
         }

         function getDataForPieChart() {
            let tempWords = [...words];
            let tempCounts = [...wordsCount];

            while (highestWord.length < 20 && tempCounts.length > 0) {
               let highestValue = Math.max(...tempCounts);
               let targetIndex = tempCounts.indexOf(highestValue);
               let currentWord = tempWords[targetIndex];

               if (currentWord && !trashWords.includes(currentWord)) {
                  highestWordIndex.push(highestValue);
                  highestWord.push(currentWord);
               }

               tempCounts.splice(targetIndex, 1);
               tempWords.splice(targetIndex, 1);
            }
            drawChart();
            drawMaterial();
            console.log(highestWordIndex);
            console.log(highestWord);
         }
