<!-- 
Lag en nettside hvor brukeren kan lime inn en lengre tekst 
knapp for å få telt opp hvor mange det er av hvert ord. 

Rens teksten for alt annet enn tegnene A-Z, Æ, Ø og Å
i store og små bokstaver, mellomrom. 
Bruk en løkke til å gå gjennom alle bokstavene 
kopier bare bokstaver over i en ny tekst.

Bruk text.split(' ') til å dele opp en tekst i en liste av ord.

Til opptellingen trenger du to lister: words og wordCounts.
Gå gjennom alle ordene. 
Sjekk først om ordet finnes i words med indexOf.
er opptellingen i samme indeks i wordCounts - øk den med én. 
Hvis ordet ikke finnes i words, legger du det til med push() 
- og du legger til 1 i wordCounts, altså wordsCounts.push(1).

Eksempel:

indeks	words	   wordCounts
0        'en'	   5
1	      'hei'	   1
2	      'eller'	2

Etter opptellingen, går du gjennom begge listene 
samtidig i en løkke og viser hvor mange det forekomster 
det var av hvert ord. 
-->

<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Document</title>
      <style>
         * {
            box-sizing: border-box;
         }

         body {
            height: 100vh;
            margin: 0px;
            padding: 10px;
         }

         #app {
            height: 100%;
            width: 100%;
         }

         .input {
            width: 100%;
            height: 30%;
            textarea {
               width: 80%;
            }
            button {
               width: 20%;
            }
         }

         .output {
            width: 100%;
            margin-top: 10px;
            align-items: center;
         }

         #text-output {
            display: flex;
            width: 100%;
            justify-content: space-between;
            padding: 20px;
            padding-left: 40px;
            padding-right: 40px;
         }

         #piechart {
            padding: 0px;
            margin: 0px;
         }

         .seperator {
            background-color: antiquewhite;
         }

         .row {
            display: flex;
            flex-direction: row;
            gap: 10px;
         }

         .column {
            display: flex;
            flex-direction: column;
         }
      </style>
   </head>
   <body>
      <div id="app"></div>

      <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
      <script>
         const app = document.getElementById("app");
         let textContent = "";
         let allWords = [];
         let allowedCharacters = [" ", "a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m", "n", "o", "p", "q", "r", "s", "t", "u", "v", "w", "x", "y", "z", "æ", "ø", "å"];

         let words = [];
         let wordsCount = [];
         let wordOutput = "";

         let maxArray = [];
         let test = [];

         function drawChart() {
            var data = google.visualization.arrayToDataTable([
               ["", ""],
               [`${test[0]}`, maxArray[0]],
               [`${test[1]}`, maxArray[1]],
               [`${test[2]}`, maxArray[2]],
               [`${test[3]}`, maxArray[3]],
               [`${test[4]}`, maxArray[4]],
               [`${test[5]}`, maxArray[5]],
               [`${test[6]}`, maxArray[6]],
               [`${test[7]}`, maxArray[7]],
               [`${test[8]}`, maxArray[8]],
               [`${test[9]}`, maxArray[9]],
            ]);

            var options = {
               legend: "none",
               pieSliceText: "label",
               title: "",
               is3D: true,
            };

            var chart = new google.visualization.PieChart(document.getElementById("piechart"));
            chart.draw(data, options);
         }

         function updateView() {
            google.charts.load("current", { packages: ["corechart"] });
            google.charts.setOnLoadCallback(drawChart);
            app.innerHTML = input();
         }
         updateView();

         function input() {
            return `
               <div class="input row">
                  <textarea onchange="cleanText(this.value)"></textarea>
                  <button onclick="updateView()">check text</button>
               </div>

               <div id="piechart" style="width: 50%; height: 50vh"></div>

               <div class="output column">
                  ${wordOutput}
               </div>
               `;
         }

         function initVariables() {
            allWords = [];
            words = [];
            wordsCount = [];
         }

         function cleanText(text) {
            initVariables();
            textContent = text;
            textToLowerCase();
            keepAllowedCharacters();
            splitText();
            removeDuplicates();
            cleanForOutput();
            getDataForPieChart();
         }

         function textToLowerCase() {
            textContent = textContent.toLowerCase();
         }

         function keepAllowedCharacters() {
            let tempText = "";
            for (let i of textContent) {
               if (allowedCharacters.includes(i)) {
                  tempText += i;
               }
            }
            textContent = tempText;
         }

         function splitText() {
            allWords = textContent.split(" ");
         }

         function removeDuplicates() {
            for (let i of allWords) {
               if (words.includes(i)) {
                  wordsCount[words.indexOf(i)]++;
               } else {
                  words.push(i);
                  wordsCount.push(1);
               }
            }
         }
         function cleanForOutput() {
            let tempWords = "";
            let count = 0;
            for (let i of words) {
               if (i !== " " && i !== "") {
                  if (count === 0) {
                     tempWords += `
                           <div id="text-output" class="seperator">
                              <span>${i}</span>
                              <span>${wordsCount[words.indexOf(i)]}</span>
                           </div>`;
                     count++;
                  } else {
                     tempWords += `
                           <div id="text-output">
                              <span>${i}</span>
                              <span>${wordsCount[words.indexOf(i)]}</span>
                           </div>`;
                     count = 0;
                  }
               }
            }
            wordOutput = tempWords;
         }

         function getDataForPieChart() {
            for (let i = 0; i < 20; i++) {
               let highestValue = Math.max(...wordsCount);
               if (words[wordsCount.indexOf(highestValue)] !== "" && words[wordsCount.indexOf(highestValue)] !== " ") {
                  maxArray.push(highestValue);
                  test.push(words[wordsCount.indexOf(highestValue)]);
                  words.splice(wordsCount.indexOf(highestValue), 1);
                  wordsCount.splice(wordsCount.indexOf(highestValue), 1);
               } else {
                  words.splice(wordsCount.indexOf(highestValue), 1);
                  wordsCount.splice(wordsCount.indexOf(highestValue), 1);
               }
            }
            console.log(maxArray);
            console.log(test);
         }
      </script>
   </body>
</html>
