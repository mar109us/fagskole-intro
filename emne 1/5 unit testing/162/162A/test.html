<!doctype html>
<html>
   <meta charset="utf-8" />
   <title>QUnit</title>
   <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.26.0.css" />
   <body>
      <div id="qunit"></div>
      <div id="qunit-fixture"></div>
      <script src="https://code.jquery.com/qunit/qunit-2.26.0.js"></script>
      <script>
         QUnit.done(function () {
            document.querySelector("#qunit-header").remove();
            document.querySelector("#qunit-banner").remove();
            document.querySelector("#qunit-userAgent").remove();
            document.querySelector("#qunit-testrunner-toolbar").remove();
            document.querySelector("#qunit-testresult").remove();
         });
      </script>
      <script src="test.js"></script>
   </body>
</html>
