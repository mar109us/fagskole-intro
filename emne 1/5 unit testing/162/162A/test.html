<!doctype html>
<html>
   <meta charset="utf-8" />
   <title>QUnit</title>
   <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.26.0.css" />
   <body>
      <div id="qunit"></div>
      <div id="qunit-fixture"></div>
      <script src="https://code.jquery.com/qunit/qunit-2.26.0.js"></script>
      <script src="main.js"></script>
      <script src="test.js"></script>
      <script>
         QUnit.done(function () {
            let header = document.querySelector("#qunit-header");
            header.remove();

            let banner = document.querySelector("#qunit-banner");
            banner.remove();

            let device = document.querySelector("#qunit-userAgent");
            device.remove();
         });

         QUnit.test("Positive: Contains '.' after '@'", function (assert) {
            const test = checkEmail("asd@asd.com");
            const expected = "@.";
            assert.equal(test, expected);
         });
      </script>
   </body>
</html>
