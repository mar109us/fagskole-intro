<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Document</title>
   </head>
   <body>
      <input type="number" name="" id="input-x-position">
      <button onclick="addCircleFromInput()">Create circle</button>
      <br />
      <svg
         id="mySvg"
         width="800"
         height="600"
         style="background-color: lightgray"
      ></svg>
      <script>
         const inputXPosition = document.getElementById("input-x-position")
         function addCircleFromInput() {
            console.log(inputXPosition.value)
         }
         function addCircle(xPosition) {
            document.getElementById("mySvg").innerHTML = /*HTML*/ `
          <circle cx="${xPosition}" cy="100" r="40" stroke="green" stroke-width="4" fill="yellow" />            
      `;
         }
         
      </script>
   </body>
</html>
