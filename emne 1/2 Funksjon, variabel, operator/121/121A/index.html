<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Document</title>
   </head>
   <body>
      Color background <br />
      <select id="select-bg-color">
         <option value="red">red</option>
         <option value="green">green</option>
         <option value="blue">blue</option>
      </select>
      <br />
      Color border <br />
      <select id="select-border-color">
         <option value="blue">blue</option>
         <option value="red">red</option>
         <option value="green">green</option>
      </select>
      <br />
      Horizontal position <br />
      <input type="number" value="80" id="input-x-position" />
      <br />
      Vertical position <br />
      <input type="number" value="80" id="input-y-position" />
      <button onclick="addCircleFromInput()">Update circle</button>
      <br />
      <svg
         id="mySvg"
         width="800"
         height="600"
         style="background-color: lightgray"
      ></svg>
      <script>
         let initXPos = 80;
         let initYPos = 80;
         let initBackgroundColor = "red";
         let initBorderColor = "blue";

         let currentXPos = initXPos;
         let currentYPos = initYPos;
         let currentBackgroundColor = initBackgroundColor;
         let currentBorderColor = initBorderColor;

         const inputXPosition = document.getElementById("input-x-position");
         const inputYPosition = document.getElementById("input-y-position");

         const circleBackgroundColor =
            document.getElementById("select-bg-color");

         const selectBorderColor = document.getElementById(
            "select-border-color",
         );

         circleBackgroundColor.addEventListener("change", (colorSelected) => {
            console.log(colorSelected.target.value);
            changeCircleBackground(colorSelected.target.value);
         });

         selectBorderColor.addEventListener("change", (colorSelected) => {
            console.log(colorSelected.target.value);
            changeCircleBorder(colorSelected.target.value);
         });

         function changeCircleBackground(color) {
            console.log(color);
            addCircle(currentXPos, currentYPos, color, currentBorderColor);
         }

         function changeCircleBorder(color) {
            console.log(color);
            addCircle(currentXPos, currentYPos, currentBackgroundColor, color);
         }

         function addCircleFromInput() {
            addCircle(
               inputXPosition.value,
               inputYPosition.value,
               currentBackgroundColor,
               currentBorderColor,
            );
         }

         function addCircle(xPosition, yPosition, fill, border) {
            currentXPos = xPosition;
            currentYPos = yPosition;
            currentBackgroundColor = fill;
            currentBorderColor = border;

            document.getElementById("mySvg").innerHTML = `
          <circle cx="${xPosition}" cy="${yPosition}" r="40" stroke="${border}" stroke-width="4" fill="${fill}" />            
      `;
         }
         addCircle(
            currentXPos,
            currentYPos,
            currentBackgroundColor,
            currentBorderColor,
         );
      </script>
   </body>
</html>
