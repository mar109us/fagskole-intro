<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Document</title>
   </head>
   <body>
      Color background <br />
      <select name="" id="">
         <option value="red">red</option>
         <option value="green">green</option>
         <option value="blue">blue</option>
      </select>
      <br />
      Horizontal position <br />
      <input type="number" id="input-x-position" />
      <br />
      Vertical position <br />
      <input type="number" id="input-y-position" />
      <button onclick="addCircleFromInput()">Update circle</button>
      <br />
      <svg
         id="mySvg"
         width="800"
         height="600"
         style="background-color: lightgray"
      ></svg>
      <script>
         const inputXPosition = document.getElementById("input-x-position");
         const inputYPosition = document.getElementById("input-y-position");
         function addCircleFromInput() {
            addCircle(inputXPosition.value, inputYPosition.value);
         }
         function addCircle(xPosition, yPosition) {
            document.getElementById("mySvg").innerHTML = /*HTML*/ `
          <circle cx="${xPosition}" cy="${yPosition}" r="40" stroke="green" stroke-width="4" fill="yellow" />            
      `;
         }
         addCircle(80,80)
      </script>
   </body>
</html>
